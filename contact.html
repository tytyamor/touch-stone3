<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content">Skip to main content</a>
    <header>
        <nav aria-label="Primary">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
        <h1>Contact Us</h1>
        <section>
            <picture>
            <img src="images/bakery-logo_c.png" alt="Bakery Logo" width="800" height="700">
            </picture>
        </section>
        <section>
            <h2>Open Everyday</h2>
            <h3>8 am to 6 pm</h3>
        </section>

    </header>
    <main id="main-content">
        <form action="/contact" method="post">
            <fieldset>
                <legend>Pre-order and Inquiry Form</legend>

                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Jane Doe">
                </div>

                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="jane@example.com">
                </div>

                <div>
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject" required>
                        <option value="">-- Select a subject --</option>
                        <option value="inquiry">Inquiry</option>
                        <option value="preorder request">Pre-order Request</option>
                    </select>
                </div>

                <div>
                    <label for="pickup">Pick Up Date:</label>
                    <input type="date" id="pickup" name="pickup" required>
                </div>

                <!-- Hidden or read-only input to capture favorited items -->
                <div class="form-group">
                    <label for="selected-favorites">Pre-ordered Favorites:</label>
                    <input type="text" id="selected-favorites" name="favorites" readonly>
                </div>

                <div>
                    <label for="message">Your Message / Item Details:</label>
                    <textarea id="message" name="message" rows="5" cols="40" required placeholder="What can we bake up together?"></textarea>
                </div>

                <div>
                    <label for="allergy">Allergy Notes:</label>
                    <textarea id="allergy" name="allergy" rows="5" cols="10" placeholder="Do you have any allergies?"></textarea>
                </div>

                <button type="submit">Send Message</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
